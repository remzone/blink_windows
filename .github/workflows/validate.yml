name: Validate Windows client
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./internal/...
      - run: go test ./...
        working-directory: native
      - run: ./tools/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Blink-Windows-x64
          path: |
            dist/Blink-Windows-*-x64.zip
            dist/SHA256SUMS
